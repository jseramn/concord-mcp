<script>
(()=>{const T=16,R=.25,q=s=>[...document.querySelectorAll(s)],c=x=>x<0?0:x>1?1:x;
const fade=q('[data-t]').map(e=>[e,...e.dataset.t.split(',').map(Number)]);
const typ=q('[data-type]').map(e=>{const[a,b]=e.dataset.type.split(',').map(Number);return[e,a,b,e.textContent]});
const pk=q('[data-pk]').map(e=>{const p=e.dataset.pk.split(',');return[e,document.getElementById(p[0]),document.getElementById(p[1]),+p[2],+p[3],+p[4],+p[5]]});
const cur=document.getElementById('cur'),prog=document.getElementById('prog'),gb=document.getElementById('gb');
function f(t){
for(const[e,a,b]of fade){let o=c((t-a)/R)*c((b-t)/R);if(e.dataset.blink)o*=Math.floor(t*4)%2?1:.3;e.style.opacity=o}
let ce=null;for(const[e,a,b,s]of typ){const n=Math.round(c((t-a)/(b-a))*s.length);e.textContent=s.slice(0,n);if(t>=a-.3&&t<b+.9&&+e.style.opacity>0)ce=e}
if(ce){const w=ce.getComputedTextLength?ce.getComputedTextLength():0;cur.setAttribute('x',826+w+2);cur.setAttribute('y',+ce.getAttribute('y')-11);cur.style.opacity=Math.floor(t*2.5)%2?0:1}else{cur.style.opacity=0}
const k=c((t-11.4)/.6);gb.style.transformOrigin='990px 352px';gb.style.transform='scaleY('+(1-k)+')';
for(const[e,p1,p2,a,b,P,off]of pk){if(t<a||t>b){e.style.opacity=0;continue}
const u=((t-a+off)%P)/P,L1=p1.getTotalLength(),L2=p2.getTotalLength(),d=u*(L1+L2),pt=d<L1?p1.getPointAtLength(d):p2.getPointAtLength(d-L1);
e.setAttribute('x',pt.x-3);e.setAttribute('y',pt.y-3);e.style.opacity=1}
prog.setAttribute('x2',30+1140*t/T)}
const m=location.hash.match(/t=([\d.]+)/);
if(m)f(+m[1]);else if(matchMedia('(prefers-reduced-motion: reduce)').matches)f(15.9);
else{const s=performance.now();const l=n=>{f(((n-s)/1000)%T);requestAnimationFrame(l)};requestAnimationFrame(l)}})();
</script>
