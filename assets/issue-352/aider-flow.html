<script>
// Deterministic animator: playwright sets window.__SCRUB + window.__T per frame.
(function () {
  var svg = document.querySelector('svg');
  var timed = Array.prototype.slice.call(svg.querySelectorAll('[data-t]'));
  var typed = Array.prototype.slice.call(svg.querySelectorAll('[data-type]'));
  var pkts = Array.prototype.slice.call(svg.querySelectorAll('[data-pk]'));
  var paths = {};
  function pathById(id) { if (!paths[id]) paths[id] = svg.querySelector('#' + id); return paths[id]; }
  function apply(t) {
    timed.forEach(function (el) {
      var w = el.getAttribute('data-t').split(',');
      el.style.display = (t >= parseFloat(w[0]) && t < parseFloat(w[1])) ? '' : 'none';
    });
    typed.forEach(function (el) {
      var w = el.getAttribute('data-type').split(',');
      var a = parseFloat(w[0]), b = parseFloat(w[1]);
      var txt = el.getAttribute('data-full') || el.textContent;
      if (!el.getAttribute('data-full')) el.setAttribute('data-full', txt);
      var p = Math.max(0, Math.min(1, (t - a) / Math.max(0.001, b - a)));
      var n = Math.round(txt.length * p);
      el.textContent = txt.slice(0, n);
    });
    pkts.forEach(function (el) {
      var w = el.getAttribute('data-pk').split(',');
      var a = parseFloat(w[1]), b = parseFloat(w[2]);
      var path = pathById(w[0]);
      if (!path) return;
      var len = path.getTotalLength();
      var p = Math.max(0, Math.min(1, (t - a) / Math.max(0.001, b - a)));
      var pt = path.getPointAtLength(len * p);
      el.setAttribute('x', pt.x - 3);
      el.setAttribute('y', pt.y - 3);
      el.style.display = (t >= a - 0.05 && t <= b + 0.05) ? '' : 'none';
    });
  }
  window.__apply = apply;
  window.__SCRUB = false;
  var t0 = performance.now();
  (function loop() {
    if (!window.__SCRUB) apply((performance.now() - t0) / 1000 % 13);
    requestAnimationFrame(loop);
  })();
})();
</script>
