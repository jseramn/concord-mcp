<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>identity drift after /resume (re #358)</title>
<style>
html,body{margin:0;background:#000;height:100%}
body{display:flex;align-items:center;justify-content:center}
svg{width:100vw;max-width:1200px;height:auto;display:block}
text{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;font-size:13px;fill:#e6e6e6;white-space:pre}
.s{font-size:11.5px}.xs{font-size:10.5px}.h{font-size:15px}
.d{fill:#8a8a8a}.f{fill:#4a4a4a}.a{fill:#9fb4a6}.r{fill:#a77a7a}
.bx{fill:none;stroke:#3a3a3a;stroke-dasharray:3 3}
.bs{fill:none;stroke:#5a5a5a}
.ln{fill:none;stroke:#3a3a3a}
.la{fill:none;stroke:#9fb4a6;stroke-width:1.2}
.lr{fill:none;stroke:#a77a7a;stroke-dasharray:4 4}
.pk{fill:#9fb4a6}.pw{fill:#e6e6e6}.pr{fill:#a77a7a}
.cur{fill:#e6e6e6}
</style></head><body>
<svg viewBox="0 0 1200 520" role="img" aria-label="Animated diagram: one Claude Code process ends up with two Concord identities after /resume — the hook announces the resumed session while the MCP server keeps the spawn-time one, so prompts are sent as the wrong agent and replies land in the wrong inbox.">
<rect width="1200" height="520" fill="#000"/>
<!-- header -->
<text x="30" y="34"><tspan class="d">building@jseramn:~$</tspan> cat re-358.identity</text>
<text x="1170" y="34" text-anchor="end" class="d" data-t="0,6.4">act 1 · <tspan class="a">one process, two ids</tspan></text>
<text x="1170" y="34" text-anchor="end" class="d" data-t="6.5,10.4">act 2 · <tspan class="r">sent as the wrong agent</tspan></text>
<text x="1170" y="34" text-anchor="end" class="d" data-t="10.5,99">act 3 · <tspan class="a">fix direction</tspan></text>
<line x1="30" y1="48" x2="1170" y2="48" class="ln" stroke-dasharray="2 4"/>

<!-- claude terminal -->
<rect x="30" y="72" width="380" height="150" class="bx"/>
<text x="46" y="92" class="xs d">claude code · one process</text>
<line x1="30" y1="100" x2="410" y2="100" class="ln"/>
<g class="s">
<text x="46" y="122" data-t="0.8,99" data-type="0.8,1.5">$ claude</text>
<text x="46" y="140" class="d" data-t="1.7,99">session fae74f31 · spawns concord-mcp</text>
<text x="46" y="164" data-t="2.7,99" data-type="2.7,3.4">$ /resume</text>
<text x="46" y="182" class="d" data-t="3.5,99">resumed session e54a37fe</text>
</g>
<rect id="cur" width="7" height="13" class="cur"/>

<!-- concord-mcp server -->
<rect x="500" y="72" width="270" height="116" class="bs"/>
<text x="635" y="94" text-anchor="middle" class="h">concord-mcp</text>
<text x="635" y="118" text-anchor="middle" class="xs d">env at spawn · never re-read</text>
<text x="635" y="138" text-anchor="middle" class="s" data-t="1.7,99">CLAUDE_CODE_SESSION_ID=fae74f31</text>
<text x="635" y="166" text-anchor="middle" class="s r" data-t="2.0,99">→ claude-code:cd4572bf</text>
<path id="pEnv" d="M410,136 H500" class="ln"/>

<!-- sessionstart hook -->
<rect x="500" y="230" width="270" height="104" class="bx"/>
<text x="635" y="252" text-anchor="middle" class="s">SessionStart hook</text>
<text x="635" y="272" text-anchor="middle" class="xs d">source=resume · e54a37fe</text>
<text x="635" y="302" text-anchor="middle" class="s a" data-t="3.7,99">→ claude-code:73f7b11c</text>
<path id="pHook" d="M410,182 C450,182 450,282 500,282" class="ln"/>

<!-- who panel -->
<rect x="30" y="250" width="380" height="172" class="bx"/>
<text x="46" y="274" class="s"><tspan class="d">$</tspan> concord who</text>
<text x="46" y="300" class="s" data-t="4.1,99">claude-code:73f7b11c   <tspan class="a">live</tspan></text>
<text x="46" y="320" class="s" data-t="4.5,99">claude-code:cd4572bf   <tspan class="r">live</tspan></text>
<g data-t="4.9,6.4" data-blink="1">
<text x="46" y="352" class="s r">! one session, two agents</text>
</g>
<text x="46" y="380" class="xs f" data-t="5.4,99">resolveActorId: session beats supplied</text>
<text x="46" y="398" class="xs f" data-t="5.4,99">→ the model cannot correct it</text>

<!-- message log -->
<rect x="810" y="72" width="360" height="236" class="bx"/>
<text x="826" y="92" class="xs d">what the store records</text>
<line x1="810" y1="100" x2="1170" y2="100" class="ln"/>
<g class="s">
<text x="826" y="122" data-t="6.7,99" data-type="6.7,7.4">update_work operation=prompt</text>
<text x="826" y="144" data-t="7.6,99">sender_agent_id=<tspan class="r">cd4572bf</tspan></text>
<text x="826" y="164" class="xs d" data-t="7.6,99">  the hook told the model it was 73f7b11c</text>
<text x="826" y="196" data-t="8.5,99" data-type="8.5,9.1">peer replies → inspect_work receipts</text>
<text x="826" y="218" data-t="9.3,99">addressed to <tspan class="r">cd4572bf</tspan> · lands in B's inbox</text>
<text x="826" y="238" class="r" data-t="9.7,99">73f7b11c never sees the reply</text>
</g>
<path id="pMsg" d="M770,120 H810" class="lr" data-t="6.7,99"/>

<!-- fix sketch -->
<g data-t="10.6,99">
<rect x="810" y="330" width="360" height="92" class="bs"/>
<text x="826" y="352" class="s">fix direction</text>
<text x="826" y="374" class="xs d">hook records session id per pid</text>
<text x="826" y="392" class="xs d">server resolves the live id — or fails on mismatch</text>
<text x="826" y="410" class="xs a">same trust boundary as the auth-bypass scan finding</text>
</g>

<!-- packets -->
<rect class="pw" width="5" height="5" data-pk="pEnv,,1.7,6.4,2.2,0"/>
<rect class="pk" width="6" height="6" data-pk="pHook,,3.7,6.4,1.6,0.4"/>
<rect class="pr" width="6" height="6" data-pk="pMsg,,6.7,10.4,1.4,0"/>
<rect class="pr" width="6" height="6" data-pk="pMsg,,6.7,10.4,1.4,0.7"/>

<!-- captions -->
<g text-anchor="middle">
<text x="600" y="462" class="h" data-t="4.9,6.4"><tspan class="d">&gt;</tspan> the hook announces A; the server still answers as B</text>
<text x="600" y="462" class="h" data-t="9.7,10.4"><tspan class="d">&gt;</tspan> replies route to B's inbox — the wrong agent</text>
<text x="600" y="462" class="h" data-t="10.9,99"><tspan class="d">&gt;</tspan> bind identity to the <tspan class="a">live</tspan> session, or fail loudly</text>
</g>
<line x1="30" y1="482" x2="1170" y2="482" class="ln"/>
<line id="prog" x1="30" y1="482" x2="30" y2="482" class="la"/>
<text x="30" y="506" class="xs d">by @jseramn · jseramn.tech · re #358</text>
<text x="1170" y="506" text-anchor="end" class="xs f">session ids and agent ids as observed · loop 14s</text>
</svg>
<script>
(()=>{const T=14,R=.25,q=s=>[...document.querySelectorAll(s)],c=x=>x<0?0:x>1?1:x;
const fade=q('[data-t]').map(e=>[e,...e.dataset.t.split(',').map(Number)]);
const typ=q('[data-type]').map(e=>{const[a,b]=e.dataset.type.split(',').map(Number);return[e,a,b,e.textContent]});
const pk=q('[data-pk]').map(e=>{const p=e.dataset.pk.split(',');return[e,document.getElementById(p[0]),p[1]?document.getElementById(p[1]):null,+p[2],+p[3],+p[4],+p[5]]});
const cur=document.getElementById('cur'),prog=document.getElementById('prog');
function f(t){
for(const[e,a,b]of fade){let o=c((t-a)/R)*c((b-t)/R);if(e.dataset.blink)o*=Math.floor(t*4)%2?1:.3;e.style.opacity=o}
let ce=null;for(const[e,a,b,s]of typ){const n=Math.round(c((t-a)/(b-a))*s.length);e.textContent=s.slice(0,n);if(t>=a-.3&&t<b+.9&&+e.style.opacity>0)ce=e}
if(ce){const x=+ce.getAttribute('x'),w=ce.getComputedTextLength?ce.getComputedTextLength():0;cur.setAttribute('x',x+w+2);cur.setAttribute('y',+ce.getAttribute('y')-11);cur.style.opacity=Math.floor(t*2.5)%2?0:1}else{cur.style.opacity=0}
for(const[e,p1,p2,a,b,P,off]of pk){if(t<a||t>b){e.style.opacity=0;continue}
const u=((t-a+off)%P)/P,L1=p1.getTotalLength(),L2=p2?p2.getTotalLength():0,d=u*(L1+L2),pt=d<L1?p1.getPointAtLength(d):p2.getPointAtLength(d-L1);
e.setAttribute('x',pt.x-3);e.setAttribute('y',pt.y-3);e.style.opacity=1}
prog.setAttribute('x2',30+1140*t/T)}
const m=location.hash.match(/t=([\d.]+)/);
if(m)f(+m[1]);else if(matchMedia('(prefers-reduced-motion: reduce)').matches)f(13.9);
else{const s=performance.now();const l=n=>{f(((n-s)/1000)%T);requestAnimationFrame(l)};requestAnimationFrame(l)}})();
</script>
</body></html>
